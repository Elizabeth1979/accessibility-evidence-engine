<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AEE modal-focus fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07110e;
        color: #f5fbf8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        position: relative;
        width: min(920px, calc(100% - 48px));
        min-height: 480px;
        padding: 42px;
        border: 1px solid #315247;
        border-radius: 20px;
        background: #0d1d18;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 38px;
      }
      .lede {
        margin: 0 0 50px;
        color: #a9bbb4;
      }
      .project {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px;
        border: 1px solid #36584d;
        border-radius: 14px;
        background: #132a23;
      }
      .project strong {
        display: block;
        font-size: 22px;
      }
      .project span {
        color: #a9bbb4;
      }
      button {
        min-height: 48px;
        padding: 10px 16px;
        border: 1px solid #527265;
        border-radius: 10px;
        background: #17372d;
        color: #f5fbf8;
        font: 750 16px inherit;
      }
      button:focus {
        outline: 4px solid #fff;
        outline-offset: 4px;
      }
      #delete-project {
        display: grid;
        width: 58px;
        padding: 0;
        place-items: center;
        border-color: #a74b4b;
        background: #3d1616;
        color: #ff9999;
      }
      #delete-project svg {
        width: 28px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      .dialog {
        position: absolute;
        inset: 54px;
        z-index: 2;
        display: grid;
        align-content: center;
        padding: 36px;
        border: 1px solid #557a6d;
        border-radius: 16px;
        background: #101e19;
        color: #f5fbf8;
        box-shadow: 0 24px 80px #000;
      }
      .dialog[hidden] {
        display: none;
      }
      .dialog h2 {
        margin-top: 0;
        font-size: 30px;
      }
      .dialog p {
        color: #b2c2bc;
      }
      .dialog div {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 34px;
      }
      .danger {
        border-color: #a74b4b;
        background: #3d1616;
        color: #ff9999;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Projects</h1>
      <p class="lede">Manage your production workspaces.</p>
      <div class="project">
        <div><strong>Project Alpha</strong><span>Production workspace</span></div>
        <button id="delete-project" type="button" aria-label="Delete Project Alpha">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"></path>
          </svg>
        </button>
      </div>
      <div id="delete-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden="">
        <h2 id="dialog-title">Delete Project Alpha?</h2>
        <p>This action cannot be undone.</p>
        <div>
          <button id="cancel-delete" type="button">Cancel</button>
          <button id="confirm-delete" class="danger" type="button">Delete project</button>
        </div>
      </div>
    </main>
    <script>
      const parameters = new URLSearchParams(location.search);
      const trigger = document.querySelector("#delete-project");
      const dialog = document.querySelector("#delete-dialog");
      const cancel = document.querySelector("#cancel-delete");

      if (parameters.get("label") === "missing") trigger.removeAttribute("aria-label");
      trigger.addEventListener("click", () => {
        dialog.hidden = false;
        if (parameters.get("focus") !== "broken") cancel.focus();
      });
      cancel.addEventListener("click", () => (dialog.hidden = true));
    </script>
  

</body></html>
