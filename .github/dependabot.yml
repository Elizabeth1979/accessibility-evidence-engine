version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's types follow the oldest Node the packages support (engines), not the newest.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
