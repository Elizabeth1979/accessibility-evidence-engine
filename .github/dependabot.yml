version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's types follow the oldest Node the packages support (engines), not the newest.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # 0.33.0 can break typing in a React input on the page under test (guidepup/virtual-screen-reader#250).
      - dependency-name: "@guidepup/virtual-screen-reader"
        versions:
          - "0.33.0"
    groups:
      # AEE reads axe's rule list from axe-core and runs axe through @axe-core/playwright, so
      # both must be one version: apart, the page runs the other copy of axe.
      axe:
        patterns:
          - "axe-core"
          - "@axe-core/*"
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL's init and analyze steps must run the same version, so they move together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
