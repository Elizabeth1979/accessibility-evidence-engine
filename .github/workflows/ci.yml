name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oldest-node:
    # The packages promise Node 22.13 and later; the main job runs Node 24.
    name: Build and unit tests on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

  verify:
    name: Build, audit, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check TypeScript
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Verify generated site content
        run: npm run site:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Enforce unit coverage
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Installs AEE into a project on the oldest Playwright it supports and runs it there.
      - name: Verify package tarballs
        run: npm run test:package

      - name: Run browser tests
        run: npm run test:playwright

      - name: Generate product shots and videos
        run: npm run site:shots
