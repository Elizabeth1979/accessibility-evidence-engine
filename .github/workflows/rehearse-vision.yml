# Temporary: rehearses the Pages deploy's AI shots with the free local model, now that each
# question carries the element's picture, and prints what the model answered. Removed before merge.
name: Rehearse vision

on:
  pull_request:

permissions:
  contents: read

jobs:
  rehearse:
    name: Local model sees the elements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AEE_LLM_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run site:lab
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run build
          bash scripts/start-local-model.sh
      - run: npx playwright test --config playwright.shots.config.ts
      - name: Print what the model answered
        if: always()
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) =>
              entry.isDirectory() ? walk(path.join(dir, entry.name)) : [path.join(dir, entry.name)]);
            for (const file of walk("test-results").filter((file) => file.endsWith(".json"))) {
              let report;
              try { report = JSON.parse(fs.readFileSync(file, "utf8")); } catch { continue; }
              for (const finding of report?.synthesis?.findings ?? []) {
                const ai = finding.remediation?.ai;
                if (!ai || ai.status === "not-applicable") continue;
                console.log(JSON.stringify({ rule: finding.ruleId, status: ai.status, provider: ai.providerId, suggestions: ai.suggestions, notes: ai.notes }, null, 2));
              }
            }'
