name: Release

# Run by hand: packs every package at the version in their package.json files and publishes them
# as one GitHub Release, which is how a project installs AEE until the packages are on npm.
"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Pack and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Installs AEE into a project on the oldest Playwright it supports and runs it there.
      - name: Verify the tarballs install into a fresh project
        run: npm run test:package

      # npm writes into the destination but does not create it.
      - name: Pack
        run: |
          mkdir release
          npm pack --workspaces --pack-destination release

      # A version that is already tagged is never reused: the job fails instead of attaching new
      # tarballs to an older commit.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p 'require("./packages/cli/package.json").version')"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" --silent 2>/dev/null; then
            echo "::error::$version is already tagged. Raise the version in every package first."
            exit 1
          fi
          gh release create "$version" release/*.tgz --target "$GITHUB_SHA" --title "$version" \
            --notes "Install every package from this release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY#install-from-github"
