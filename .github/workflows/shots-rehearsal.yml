# Temporary: rehearses the Pages deploy's shots with the local model on this pull request. Reverted
# before merge.
name: Shots rehearsal

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AEE_LLM_PROVIDER: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start the local model
        run: |
          npm run build
          bash scripts/start-local-model.sh
      - name: Measure one answer
        run: |
          cat > measure.js <<'JS'
          // Temporary: one specialist-sized question, timed, with the model's default and with thinking off.
          const { ACCESSIBILITY_ENGINEER_PROMPT, DEFAULT_LOCAL_MODEL } = require("@aee/ai-fixes");
          const input = { selector: "#archive-project", role: "button", nearbyHeading: "Projects", nearbyText: "Project Alpha Website accessibility review", iconDescription: "<svg><path d=\"M4 8h16v12H4zM3 4h18v4H3zM9 12h6\"/></svg>" };
          (async () => {
            for (const think of ["default", false, "default"]) {
              const started = Date.now();
              const r = await fetch("http://127.0.0.1:11434/api/chat", { method: "POST", body: JSON.stringify({
                model: DEFAULT_LOCAL_MODEL, stream: false, format: "json", options: { temperature: 0 },
                ...(think === "default" ? {} : { think }),
                messages: [{ role: "system", content: `${ACCESSIBILITY_ENGINEER_PROMPT}\nAnswer with only a JSON object {"text": string, "confidence": number}.` }, { role: "user", content: JSON.stringify(input) }]
              }) }).then((response) => response.json());
              console.log(JSON.stringify({ think, seconds: (Date.now() - started) / 1000, promptTokens: r.prompt_eval_count, promptSeconds: r.prompt_eval_duration / 1e9, outputTokens: r.eval_count, outputSeconds: r.eval_duration / 1e9, thinkingChars: (r.message?.thinking ?? "").length, content: r.message?.content, error: r.error }));
            }
          })();
          JS
          node measure.js
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shots
          path: |
            site/shots
            ${{ runner.temp }}/ollama/serve.log
