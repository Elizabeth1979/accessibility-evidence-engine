name: Pages

"on":
  push:
    branches:
      - main
    paths:
      - site/**
      - packages/**
      - package-lock.json
      - playwright.shots.config.ts
      - tests/product-shots.shots.ts
      - tests/test-lab-helpers.ts
      - tests/scenario-helpers.ts
      - packages/schemas/json/remediation-registry.json
      - packages/schemas/json/remediation-registry.schema.json
      - scripts/generate-site-registry.mjs
      - scripts/generate-roadmap.mjs
      - scripts/generate-test-lab.mjs
      - scripts/site-page.mjs
      - scripts/start-local-model.sh
      - docs/MASTER-PLAN.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The AI suggestion shots come from a free model on the runner, or from Claude once an
    # ANTHROPIC_API_KEY secret exists.
    env:
      AEE_LLM_PROVIDER: ${{ secrets.ANTHROPIC_API_KEY && 'claude' || 'local' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated registry
        run: npm run site:check

      - name: Generate roadmap from the master plan
        run: npm run site:roadmap

      - name: Generate test lab from its contract
        run: npm run site:lab

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the local model
        if: env.AEE_LLM_PROVIDER == 'local'
        run: |
          npm run build
          bash scripts/start-local-model.sh

      - name: Generate product shots and videos from a real run
        run: npm run site:shots

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
