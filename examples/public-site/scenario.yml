$schema: ../../packages/schemas/json/scenario.schema.json
schemaVersion: 0.1.0
id: public-site-homepage

target:
  url: https://elizabeth1979.github.io/accessibility-evidence-engine/
  allowedOrigins:
    - https://elizabeth1979.github.io/accessibility-evidence-engine/

standard:
  name: WCAG
  version: "2.2"
  levels:
    - A
    - AA

profile: core
goal: Test a public homepage and its primary navigation without entering an account or payment workflow.

journeys:
  - id: explore-public-homepage
    name: Explore the public homepage
    goal: Understand the product and reach public information safely.
    startPath: /
    allowedActions:
      - navigate
      - open-menus
      - hover
      - focus
      - activate-public-links
    forbiddenActions:
      - sign-in
      - create-account
      - submit-personal-information
      - initiate-payment
    virtualScreenReaderCommands:
      - next-landmark
      - next-heading
      - next-control
    interactionComparisons:
      - id: nav-link-hover-focus
        name: The GitHub link remains available on pointer hover and keyboard focus
        pointerActions:
          - id: hover-github-link
            kind: hover
            target:
              role: link
              name: GitHub
        keyboardActions:
          - id: focus-github-link
            kind: focus
            target:
              role: link
              name: GitHub
        observe:
          target:
            role: link
            name: GitHub
          url: true
          visible: true
          text: true
        expected:
          visible: true
          text: GitHub

privacy:
  storage: local
  remoteUpload: forbidden
  sharingReviewRequired: true

approval:
  required: true
  approvedPlanDigest: sha256:4491facad41de0b4ed4b7de2787d9f1ba0a8811288fed90ce0401d857881a3d0
