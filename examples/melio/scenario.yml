$schema: ../../packages/schemas/json/scenario.schema.json
schemaVersion: 0.1.0
id: melio-public-homepage

target:
  url: https://melio.com/
  allowedOrigins:
    - https://melio.com/

standard:
  name: WCAG
  version: "2.2"
  levels:
    - A
    - AA

profile: core
goal: Test the public Melio homepage and primary navigation without entering a private or financial workflow.

journeys:
  - id: explore-public-homepage
    name: Explore the public homepage
    goal: Understand Melio and reach public information or the beginning of sign-up safely.
    startPath: /
    allowedActions:
      - navigate
      - open-menus
      - hover
      - focus
      - activate-public-links
    forbiddenActions:
      - sign-in
      - create-account
      - submit-personal-information
      - initiate-payment
    virtualScreenReaderCommands:
      - next-landmark
      - next-heading
      - next-control
    interactionComparisons:
      - id: sign-in-hover-focus
        name: Sign in remains available on pointer hover and keyboard focus
        pointerActions:
          - id: hover-sign-in
            kind: hover
            target:
              role: link
              name: Sign in
        keyboardActions:
          - id: focus-sign-in
            kind: focus
            target:
              role: link
              name: Sign in
        observe:
          target:
            role: link
            name: Sign in
          url: true
          visible: true
          text: true
        expected:
          visible: true
          text: Sign in

privacy:
  storage: local
  remoteUpload: forbidden
  sharingReviewRequired: true

approval:
  required: true
  approvedPlanDigest: sha256:8d8b84109f3108b00e68cf4f28630efcac13d941dc8dab48f663175d8d816134
